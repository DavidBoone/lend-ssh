name: test
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server shellcheck zsh
      - if: runner.os == 'macOS'
        run: brew install shellcheck
      - run: test/run.sh
        env:
          SSHD: /usr/sbin/sshd
      - if: runner.os == 'Linux'
        run: test/docker.sh
